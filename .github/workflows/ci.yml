name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git cmake ninja qt6-base qt6-declarative qt6-shadertools \
            mpv taglib chromaprint ffmpeg yt-dlp python
      - uses: actions/checkout@v7
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Smoke test (alignment, muxing, binaries)
        run: ci/smoke.sh build

  package:
    name: package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git cmake ninja qt6-base qt6-declarative qt6-shadertools \
            mpv taglib chromaprint ffmpeg yt-dlp
      - uses: actions/checkout@v7
      - name: Build the pacman package from this tree
        run: ci/makepkg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pacman-package
          path: packaging/*.pkg.tar.zst

  windows:
    name: windows
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p qt6-base:p qt6-declarative:p qt6-shadertools:p
            mpv:p taglib:p chromaprint:p ffmpeg:p ntldd:p python:p
      - uses: actions/checkout@v7
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Smoke test (alignment, muxing, binaries)
        run: ci/smoke.sh build
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the installer from this tree
        run: ci/winpkg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: packaging/windows/out/*-setup.exe
